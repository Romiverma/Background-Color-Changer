
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>

    <link rel="stylesheet" href="Project 1.css">
</head>

<body>

    <div class="container">

        <h1>Background Color Changer</h1>

        <p id="colorCode">#FFFFFF</p>

        <h3>Choose Your Favourite Color</h3>

        <div class="colors">

            <button class="color-btn" data-color="#E8B4B8">
                Dusty Pink
                <span>#E8B4B8</span>
            </button>

            <button class="color-btn" data-color="#A8BFA3">
                Sage Green
                <span>#A8BFA3</span>
            </button>

            <button class="color-btn" data-color="#A7C7E7">
                Powder Blue
                <span>#A7C7E7</span>
            </button>

            <button class="color-btn" data-color="#D8BFD8">
                Lavender
                <span>#D8BFD8</span>
            </button>

            <button class="color-btn" data-color="#F4C27A">
                Warm Peach
                <span>#F4C27A</span>
            </button>

            <button class="color-btn" data-color="#C76E5B">
                Terracotta
                <span>#C76E5B</span>
            </button>

            <button class="color-btn" data-color="#D4AF37">
                Royal Gold
                <span>#D4AF37</span>
            </button>

            <button class="color-btn" data-color="#344E41">
                Forest Green
                <span>#344E41</span>
            </button>

        </div>

        <button id="resetColor">Reset Color</button>

    </div>

    <script src="Project 1.js"></script>

</body>
</html>
